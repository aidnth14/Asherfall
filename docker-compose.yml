version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: asherfall-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: asherfall-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

volumes:
  redis_data:
